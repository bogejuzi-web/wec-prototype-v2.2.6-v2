<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 800" role="img" aria-labelledby="xinhua-v2-flow-title xinhua-v2-flow-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="xinhua-v2-flow-title">新华尊与睿聆 H5 免备案服务对接泳道图</title>
      <desc id="xinhua-v2-flow-desc">用户、新华尊和睿聆三方完成 H5 进入、用户识别、服务发起和服务信息回传的流程。</desc>
      <defs><style><![CDATA[.lane-label{fill:#fff;font-size:20px;font-weight:700;text-anchor:middle}.node-title{fill:#1f2937;font-size:16px;font-weight:700;text-anchor:middle}.node-sub{fill:#475569;font-size:12px;text-anchor:middle}.arrow-label{fill:#475569;font-size:12px;text-anchor:middle}.lane-user{fill:#f3f8ff}.lane-xinhua{fill:#f1fbf7}.lane-wec{fill:#fff8ef}.node-user{fill:#e7f2ff;stroke:#1677ff}.node-xinhua{fill:#e8fff5;stroke:#00a870}.node-wec{fill:#fff3e5;stroke:#d97706}.node{stroke-width:2;rx:8}.lane-line{stroke:#cbd5e1;stroke-width:1}.flow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.flow-xinhua{fill:none;stroke:#00a870;stroke-width:2;marker-end:url(#arrow-xinhua)}.flow-wec{fill:none;stroke:#d97706;stroke-width:2;marker-end:url(#arrow-wec)}.field{fill:#fff;stroke:#cbd5e1;stroke-width:1;rx:4} text{font-family:Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif}]]></style>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker>
        <marker id="arrow-xinhua" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#00a870"/></marker>
        <marker id="arrow-wec" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker>
      </defs>

      <rect x="40" y="40" width="400" height="700" class="lane-user"/>
      <rect x="440" y="40" width="400" height="700" class="lane-xinhua"/>
      <rect x="840" y="40" width="400" height="700" class="lane-wec"/>
      <rect x="40" y="40" width="400" height="48" fill="#1677ff"/>
      <rect x="440" y="40" width="400" height="48" fill="#00a870"/>
      <rect x="840" y="40" width="400" height="48" fill="#d97706"/>
      <text x="240" y="72" class="lane-label">用户</text>
      <text x="640" y="72" class="lane-label">新华尊</text>
      <text x="1040" y="72" class="lane-label">睿聆</text>
      <line x1="440" y1="40" x2="440" y2="740" class="lane-line"/>
      <line x1="840" y1="40" x2="840" y2="740" class="lane-line"/>

      <!-- connectors: draw before nodes -->
      <path d="M320 316 H896" class="flow"/>
      <rect x="548" y="288" width="120" height="20" class="field"/>
      <text x="608" y="303" class="arrow-label">打开 H5</text>

      <path d="M1004 352 V392 H220 V460" class="flow-wec"/>
      <rect x="520" y="364" width="176" height="20" class="field"/>
      <text x="608" y="379" class="arrow-label">展示项目可用服务</text>

      <path d="M320 496 H896" class="flow-wec"/>
      <rect x="508" y="468" width="208" height="20" class="field"/>
      <text x="612" y="483" class="arrow-label">发起服务并提交本次信息</text>

      <path d="M1004 532 V584 H640 V640" class="flow-wec"/>
      <rect x="712" y="556" width="208" height="20" class="field"/>
      <text x="816" y="571" class="arrow-label">服务请求信息回传</text>

      <!-- nodes -->
      <rect x="120" y="280" width="200" height="72" class="node node-user"/>
      <text x="220" y="312" class="node-title">进入睿聆 H5</text>
      <text x="220" y="332" class="node-sub">进入时不填写个人信息</text>

      <rect x="896" y="280" width="216" height="72" class="node node-wec"/>
      <text x="1004" y="312" class="node-title">识别用户</text>
      <text x="1004" y="332" class="node-sub">不备案、不鉴权、不绑权益</text>

      <rect x="120" y="460" width="200" height="72" class="node node-user"/>
      <text x="220" y="492" class="node-title">发起服务</text>
      <text x="220" y="512" class="node-sub">按既有服务配置操作</text>

      <rect x="896" y="460" width="216" height="72" class="node node-wec"/>
      <text x="1004" y="492" class="node-title">创建服务请求</text>
      <text x="1004" y="512" class="node-sub">收集本次服务所需信息</text>

      <rect x="544" y="640" width="192" height="72" class="node node-xinhua"/>
      <text x="640" y="672" class="node-title">接收服务数据</text>
      <text x="640" y="692" class="node-sub">用于新华尊侧业务处理</text>

    </svg>
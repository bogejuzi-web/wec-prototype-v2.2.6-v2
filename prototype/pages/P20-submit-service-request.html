<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>P20 提交服务请求</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eef4f6;color:#31363c;font-family:"Microsoft YaHei",Arial,sans-serif}.hero{height:176px;position:relative;overflow:hidden;background:linear-gradient(112deg,#67b8bd,#e5f0f2)}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 5%,rgba(255,255,255,.45),transparent 28%),linear-gradient(115deg,rgba(0,83,88,.26),rgba(255,255,255,.18))}.hero h1{position:absolute;left:28px;bottom:20px;margin:0;color:#0a5055;font-size:31px;letter-spacing:2px}.hero span{position:absolute;right:30px;bottom:0;width:90px;height:132px;border-radius:50% 50% 10px 10px;background:rgba(255,255,255,.43)}.sheet{position:relative;margin-top:-26px;padding:25px 18px 26px;border-radius:30px 30px 0 0;background:#fff;box-shadow:0 -2px 10px rgba(18,72,77,.09)}.sheet-head{display:flex;align-items:center;padding:0 0 22px;border-bottom:1px solid #e5edf0}.icon{display:grid;place-items:center;width:43px;height:43px;border-radius:15px;background:#dff8f5;color:#21b8b1;font-size:24px}.sheet-head h2{margin:0 0 0 13px;font-size:25px}.close{margin-left:auto;display:grid;place-items:center;width:42px;height:42px;border:0;border-radius:50%;background:#f0f3f5;color:#7f888c;font-size:30px;cursor:pointer}.notice{display:flex;align-items:center;gap:15px;margin:22px 0 24px;padding:17px;border-radius:17px;background:#f1f8fb}.notice .icon{width:54px;height:54px;border-radius:18px;background:#2cb7b0;color:#fff;font-size:27px;box-shadow:0 7px 13px rgba(27,159,154,.19)}.notice b{display:block;font-size:21px}.notice span{display:block;margin-top:6px;color:#718297;font-size:16px}.field{margin:0 0 20px}.field label{display:block;margin-bottom:9px;font-size:19px;font-weight:600}.required{color:#ff5a66}.input,.select{width:100%;height:52px;padding:0 15px;border:1px solid #e5e9ed;border-radius:12px;background:#fff;color:#3d464d;font-size:17px;outline:none}.input::placeholder{color:#a7adb4}.input:focus,.select:focus,.textarea:focus{border-color:#23b7b0;box-shadow:0 0 0 3px rgba(35,183,176,.13)}.choice{display:flex;gap:12px}.choice button{height:44px;flex:1;border:1px solid #e5e9ed;border-radius:11px;background:#fff;color:#68747c;font-size:16px;cursor:pointer}.choice button.selected{border-color:#28b8b1;background:#ecfbf9;color:#078c86;font-weight:700}.textarea{width:100%;height:112px;padding:14px 15px;border:1px solid #e5e9ed;border-radius:12px;resize:vertical;font:17px "Microsoft YaHei",Arial;outline:none}.hint{margin:-8px 0 20px;color:#9aa1a7;font-size:14px}.submit{width:100%;height:57px;border:0;border-radius:14px;background:#22aaa5;color:#fff;font-size:20px;font-weight:700;box-shadow:0 8px 18px rgba(25,169,163,.22);cursor:pointer}.toast{position:fixed;left:50%;bottom:24px;z-index:4;max-width:calc(100% - 40px);padding:10px 14px;border-radius:8px;background:rgba(28,42,48,.92);color:#fff;font-size:14px;transform:translate(-50%,80px);opacity:0;transition:.2s}.toast.show{transform:translate(-50%,0);opacity:1}.tag{margin-left:5px;padding:2px 6px;border-radius:8px;background:#fff0c7;color:#9a6900;font-size:11px;vertical-align:middle}body[data-prototype-mode="prototype"] .tag{display:none}
  </style>
</head>
<body>
  <header class="hero"><h1>人工服务</h1><span></span></header>
  <main class="sheet"><header class="sheet-head"><div class="icon">▦</div><h2>提交服务请求</h2><button class="close" type="button" onclick="showToast('已关闭服务请求')">×</button></header><section class="notice"><div class="icon">▦</div><div><b>请如实填写就诊需求</b><span>客服将尽快为您安排专属服务</span></div></section><form id="service-form"><div class="field" data-change-id="P20-C01"><label>就诊人姓名 <i class="required">*</i> <span class="tag">P20-C01</span></label><input class="input" name="name" placeholder="请输入就诊人姓名"></div><div class="field"><label>性别 <i class="required">*</i></label><div class="choice" data-field="gender"><button type="button" class="selected">男</button><button type="button">女</button><button type="button">未知</button></div></div><div class="field"><label>身份类别 <i class="required">*</i></label><select class="select" name="identity"><option value="">请选择身份类别</option><option>本人</option><option>家属</option><option>其他</option></select></div><div class="field"><label>证件号信息 <i class="required">*</i></label><input class="input" name="idNumber" placeholder="请输入证件号"></div><div class="field"><label>联系电话 <i class="required">*</i></label><input class="input" name="phone" placeholder="请输入联系电话"></div><div class="field"><label>主诉简述 <i class="required">*</i></label><textarea class="textarea" name="complaint" placeholder="请简要描述您的症状及过往病史"></textarea></div><p class="hint">详细主诉描述有助于我们为您安排更合适的服务</p><button class="submit" type="submit">▦　提交预约申请</button></form></main><div id="toast" class="toast" role="status"></div>
  <script>
    let selectedGender='男';
    function showToast(text){const toast=document.getElementById('toast');toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}
    document.querySelectorAll('[data-field="gender"] button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-field="gender"] button').forEach(item=>item.classList.remove('selected'));button.classList.add('selected');selectedGender=button.textContent}));
    document.getElementById('service-form').addEventListener('submit',event=>{event.preventDefault();const form=new FormData(event.currentTarget);if(!form.get('name')||!form.get('identity')||!form.get('idNumber')||!form.get('phone')||!form.get('complaint')){showToast('请完整填写服务请求信息');return}showToast('服务请求已提交，性别：'+selectedGender)});
    function init(){document.body.dataset.prototypeMode=new URLSearchParams(location.search).get('prototypeMode')||'annotation'}
    window.addEventListener('message',event=>{if(event.data.type==='prototype:set-mode')document.body.dataset.prototypeMode=event.data.mode;if(event.data.type==='prototype:highlight'){const node=document.querySelector('[data-change-id="'+event.data.changeId+'"]');if(node){node.scrollIntoView({behavior:'smooth',block:'center'});node.style.outline='3px solid #f59e0b';setTimeout(()=>node.style.outline='',1500)}}});init();
  </script>
</body>
</html>

  <title>P15 H5 材料收集提醒</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f8fa;color:#173c4a;font:14px "Microsoft YaHei",Arial}.phone{min-height:100vh;max-width:430px;margin:auto;padding:18px 22px 88px;background:#f3f8fa}.greeting{font-size:13px;color:#476470}.member{display:flex;align-items:center;gap:8px;margin:7px 0 18px;font-size:22px;font-weight:700}.vip{padding:3px 8px;border-radius:12px;background:#52c5d1;color:#fff;font-size:12px}.banner{position:relative;height:222px;overflow:hidden;padding:64px 24px;border-radius:14px;background:linear-gradient(110deg,#91dfe7,#dff7fa 53%,#8fd0e4);color:#176979}.banner:before{content:"";position:absolute;right:-20px;top:-24px;width:190px;height:270px;border-radius:80px 20px 0 0;background:linear-gradient(140deg,rgba(255,255,255,.9),rgba(173,222,239,.28));transform:rotate(12deg)}.banner:after{content:"✚";position:absolute;right:48px;top:60px;color:#fff;font-size:78px;opacity:.68}.banner h1,.banner p,.pager{position:relative;z-index:1}.banner h1{margin:0;font-size:20px;white-space:nowrap}.banner p{margin:9px 0;color:#277b89;text-align:center}.pager{position:absolute;left:0;right:0;bottom:15px;text-align:center;color:#5d7881}.dots{display:block;margin-top:9px;color:#7ed3d9;letter-spacing:5px}.arrow{position:absolute;z-index:2;top:81px;width:25px;height:25px;border:0;border-radius:50%;background:#fff;color:#55b6c4;font-size:20px;line-height:18px}.arrow.left{left:7px}.arrow.right{right:7px}.reminder{display:flex;align-items:center;gap:11px;width:100%;margin:16px 0 12px;padding:13px 14px;border:1px solid #f0d595;border-radius:12px;background:#fff9e8;color:#7b5e1c;text-align:left;cursor:pointer}.reminder:focus-visible{outline:3px solid rgba(245,158,11,.45);outline-offset:2px}.reminder-icon{display:grid;place-items:center;flex:0 0 35px;width:35px;height:35px;border-radius:10px;background:#fff0c7;font-size:20px}.reminder b{display:block;font-size:15px}.reminder span{display:block;margin-top:3px;color:#aa8a49;font-size:12px}.chevron{margin-left:auto;font-size:24px;color:#c19d4e}.menu{padding:17px 14px 14px;border-radius:15px;background:#fff}.menu h2{margin:0 0 12px;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.service{display:flex;align-items:center;gap:13px;min-height:85px;padding:14px;border-radius:16px;background:#f8fbfc;color:#12717b;font-size:16px;font-weight:700}.service-icon{display:grid;place-items:center;width:45px;height:45px;border-radius:13px;background:linear-gradient(135deg,#8cdb94,#4eb66d);box-shadow:0 7px 12px rgba(66,165,96,.23);color:#fff;font-size:23px}.service:nth-child(2) .service-icon{background:linear-gradient(135deg,#8fe4a0,#46b66c)}.service:nth-child(3) .service-icon{background:linear-gradient(135deg,#96db8b,#55bd71)}.service:nth-child(4) .service-icon{background:linear-gradient(135deg,#9de5a5,#54b96d)}.identity{margin-top:17px;padding:25px 20px;border-radius:14px;background:linear-gradient(118deg,#58c8dd,#60d0e8 55%,#79cfe2);color:#fff;box-shadow:0 8px 18px rgba(48,162,187,.2)}.identity small{display:block;margin-bottom:5px}.identity b{font-size:16px}.pill{display:inline-block;margin-left:7px;padding:3px 8px;border-radius:10px;background:#fff;color:#39a8bc;font-size:12px}.identity p{margin:6px 0 0;font-size:13px}.bottom-nav{position:fixed;left:50%;bottom:0;z-index:3;display:flex;justify-content:space-around;width:min(430px,100%);height:70px;padding-top:10px;transform:translateX(-50%);border-radius:15px 15px 0 0;background:#fff;box-shadow:0 -5px 18px rgba(33,66,77,.08);color:#8a9aa1;text-align:center}.bottom-nav div{min-width:80px}.bottom-nav .active{color:#14afb4}.nav-icon{display:block;font-size:23px;line-height:25px}.tag{margin-left:5px;padding:1px 5px;border-radius:8px;background:#fff0c7;color:#9a6900;font-size:11px}body[data-prototype-mode="prototype"] .tag{display:none}.highlight{outline:3px solid #f59e0b;outline-offset:3px}
  </style>
</head>
<body>
  <main class="phone">
    <div class="greeting">尊敬的会员</div>
    <div class="member">魏志远 <span class="vip">VIP</span></div>
    <section class="banner" aria-label="项目轮播图"><button class="arrow left" type="button">‹</button><button class="arrow right" type="button">›</button><h1>弘杰春蕾医疗健康管理项目</h1><p>全方位健康体检与管理</p><div class="pager">1 / 5<span class="dots">━━━━</span></div></section>
    <button class="reminder" type="button" data-change-id="P15-C01" onclick="openMaterialCollection()"><span class="reminder-icon">▣</span><span><b>材料上传提醒 <em class="tag">P15-C01</em></b><span>您有 2 项材料待上传，点击立即处理</span></span><strong class="chevron">›</strong></button>
    <section class="menu"><h2>服务菜单</h2><div class="grid"><div class="service"><span class="service-icon">▣</span>绿通服务</div><div class="service"><span class="service-icon">●</span>电话医生</div><div class="service"><span class="service-icon">■</span>在线医生</div><div class="service"><span class="service-icon">◉</span>购药服务</div></div></section>
    <section class="identity"><small>当前服务对象</small><b>魏志远</b><span class="pill">主账号</span><span class="pill">本人</span><p>发起服务将以该成员身份使用权益</p></section>
  </main>
  <nav class="bottom-nav"><div class="active"><span class="nav-icon">⌂</span>首页</div><div><span class="nav-icon">♙</span>我的</div></nav>
  <script>
    function openMaterialCollection(){window.parent.postMessage({type:'prototype:navigate',pageId:'P07'},'*')}
    function init(){const p=new URLSearchParams(location.search);document.body.dataset.prototypeMode=p.get('prototypeMode')||'annotation'}
    window.addEventListener('message',e=>{if(e.data.type==='prototype:set-mode')document.body.dataset.prototypeMode=e.data.mode;if(e.data.type==='prototype:highlight'){const n=document.querySelector('[data-change-id="'+e.data.changeId+'"]');if(n){n.scrollIntoView({behavior:'smooth',block:'center'});n.classList.add('highlight');setTimeout(()=>n.classList.remove('highlight'),1500)}}});init()
  </script>
</body>

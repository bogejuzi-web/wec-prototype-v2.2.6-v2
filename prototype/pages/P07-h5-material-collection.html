<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>P07 H5 材料收集</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f8f9;color:#243744;font:14px "Microsoft YaHei",Arial}.phone,.success{min-height:100vh;max-width:430px;margin:auto;background:#f5f8f9}.header{height:55px;background:#fff;display:flex;align-items:center;padding:0 17px}.header span{font-size:26px}.header h1{font-size:17px;margin:auto}.service{padding:17px;background:#fff;margin-top:1px}.service b{font-size:16px}.service p{margin:7px 0 0;color:#78909a;font-size:12px}.tip{margin:13px;padding:10px;border-left:3px solid #4bb8ad;border-radius:5px;background:#edf9f7;color:#39746e;line-height:1.5}.material-card{margin:13px;padding:17px;border-radius:9px;background:#fff}.head{display:flex;align-items:center}.head b{font-size:16px}.state{margin-left:auto;padding:3px 8px;border-radius:10px;background:#eef2f3;color:#778892;font-size:12px}.desc{margin:9px 0;color:#607682;line-height:1.6}.upload{min-height:94px;border:1px dashed #75c7c0;border-radius:6px;background:#f4fcfa;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:8px;color:#009b92}.image{position:relative;width:63px;height:63px;border:1px solid #89d1ca;border-radius:5px;overflow:hidden;background:linear-gradient(145deg,#bcecf0 0 47%,#65bdb4 48% 70%,#ebf8f4 71%);color:#fff;text-align:center;font-size:11px;line-height:63px}.image:before{content:'图片';padding:2px 4px;border-radius:3px;background:rgba(20,93,92,.55)}.doc-file{position:relative;width:63px;height:63px;border-radius:5px;padding-top:22px;color:#fff;text-align:center;font-size:11px}.doc-file.pdf{background:#db6a63}.doc-file.word{background:#4c87c8}.delete-image,.doc-file button{position:absolute;top:2px;right:2px;width:18px;height:18px;padding:0;border:0;border-radius:50%;background:rgba(35,54,61,.78);color:#fff;font-size:14px;line-height:18px;cursor:pointer}.add-image{width:63px;height:63px;border:1px dashed #75c7c0;border-radius:5px;background:#fff;color:#009b92;font-size:22px;cursor:pointer}.hint{width:100%;font-size:12px;text-align:center}.submit,.home{height:43px;width:calc(100% - 26px);margin:14px 13px 28px;border:0;border-radius:22px;background:#009b92;color:#fff;font-size:15px;cursor:pointer}.toast{display:none;position:fixed;z-index:30;left:50%;bottom:30px;transform:translateX(-50%);padding:10px 17px;border-radius:5px;background:#263542;color:#fff;white-space:nowrap}.toast.show{display:block}.upload-mask{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;background:rgba(16,31,40,.42)}.upload-mask.show{display:flex}.upload-sheet{width:100%;padding:10px 12px 18px;border-radius:16px 16px 0 0;background:#f6f8f9}.upload-sheet h3{margin:5px 0 10px;text-align:center;font-size:15px}.sheet-option{width:100%;padding:14px;border:0;border-bottom:1px solid #e8edef;background:#fff;color:#263a43;font-size:15px;text-align:left}.sheet-option small{display:block;margin-top:4px;color:#87959a;font-size:11px}.sheet-cancel{width:100%;margin-top:9px;padding:13px;border:0;border-radius:8px;background:#fff;color:#52636b;font-size:15px}.file-kinds[hidden],.main-actions[hidden]{display:none}.success{padding-top:130px;text-align:center;background:#fff}.success .mark{width:70px;height:70px;margin:auto;border-radius:50%;background:#15b587;color:#fff;font-size:45px;line-height:70px}.success h2{margin:23px 0 10px;font-size:21px}.success p{color:#71818b;line-height:1.6;padding:0 40px}.tag{margin-left:5px;padding:1px 5px;border-radius:8px;background:#fff0c7;color:#9a6900;font-size:11px}body[data-prototype-mode="prototype"] .tag{display:none}.highlight{outline:3px solid #f59e0b;outline-offset:3px}
  </style>
</head>
<body>
  <main id="collection-page" class="phone">
    <header class="header"><span>‹</span><h1>上传材料</h1><span style="width:17px"></span></header>
    <section class="service"><b>海外多学科会诊（MDT）</b><p>服务单号：TKT20260820001</p></section>
    <p class="tip" data-change-id="P07-C01">请按材料标题和上传说明补充附件。每项材料至少上传一个文件后才可提交。 <span class="tag">P07-C01</span></p>
    <section class="material-card" data-uploaded="false"><div class="head"><b>病历资料</b><span class="state">待上传</span></div><p class="desc">请上传近期检查报告、病历及影像资料。</p><div class="upload"><button class="add-image" type="button" onclick="uploadImage(this)">＋</button><span class="hint">点击上传</span></div></section>
    <section class="material-card" data-uploaded="false" data-change-id="P07-C02"><div class="head"><b>影像资料</b><span class="state">待上传</span><span class="tag">P07-C02</span></div><p class="desc">请上传近三个月的影像检查资料。</p><div class="upload"><button class="add-image" type="button" onclick="uploadImage(this)">＋</button><span class="hint">点击上传</span></div></section>
    <button class="submit" onclick="submitMaterials()">提交材料</button>
  </main>
  <main id="success-page" class="success" hidden data-prototype-state="P07-S01" data-state-id="P07-S01"><div class="mark">✓</div><h2>材料提交成功</h2><p>您提交的材料已进入审核流程，请留意后续服务进展。</p><button class="home" onclick="returnHome()">返回首页</button></main>
  <div id="toast" class="toast"></div>
  <div id="upload-mask" class="upload-mask" aria-hidden="true">
    <section class="upload-sheet">
      <div class="main-actions"><h3>选择上传方式</h3><button class="sheet-option" type="button" data-action="file">文件上传<small>支持图片、PDF、Word 文档</small></button><button class="sheet-option" type="button" data-action="album">相册<small>从相册选择图片上传</small></button><button class="sheet-option" type="button" data-action="camera">拍照<small>调用相机拍摄并上传图片</small></button></div>
      <div class="file-kinds" hidden><h3>选择文件类型</h3><button class="sheet-option" type="button" data-action="image">图片</button><button class="sheet-option" type="button" data-action="pdf">PDF 文档</button><button class="sheet-option" type="button" data-action="word">Word 文档</button></div>
      <button class="sheet-cancel" type="button" data-action="cancel">取消</button>
    </section>
  </div>
  <script>
    function showToast(text){const node=document.getElementById('toast');node.textContent=text;node.classList.add('show');setTimeout(()=>node.classList.remove('show'),1800)}
    let targetButton=null;
    const mask=document.getElementById('upload-mask'),mainActions=mask.querySelector('.main-actions'),fileKinds=mask.querySelector('.file-kinds');
    function closeUpload(){mask.classList.remove('show');mask.setAttribute('aria-hidden','true');mainActions.hidden=false;fileKinds.hidden=true;targetButton=null}
    function uploadImage(button){targetButton=button;mask.classList.add('show');mask.setAttribute('aria-hidden','false')}
    function addFile(type,source){const card=targetButton.closest('.material-card'),upload=targetButton.closest('.upload'),count=Number(card.dataset.count||0)+1;card.dataset.count=count;card.dataset.uploaded='true';card.querySelector('.state').textContent='已上传 '+count+' 个';const file=document.createElement('div');file.className=type==='image'?'image':'doc-file '+type;file.title=type==='image'?'已上传图片 '+count:type==='pdf'?'已上传 PDF 文档':'已上传 Word 文档';if(type!=='image')file.textContent=type==='pdf'?'PDF':'WORD';const remove=document.createElement('button');remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','删除附件');remove.onclick=()=>{file.remove();const left=card.querySelectorAll('.image,.doc-file').length;card.dataset.count=left;card.dataset.uploaded=left?'true':'false';card.querySelector('.state').textContent=left?'已上传 '+left+' 个':'待上传';showToast('已删除附件')};file.appendChild(remove);upload.insertBefore(file,targetButton);closeUpload();showToast(source+'上传成功')}
    mask.addEventListener('click',e=>{if(e.target===mask)return closeUpload();const option=e.target.closest('[data-action]');if(!option)return;const action=option.dataset.action;if(action==='cancel')return closeUpload();if(action==='file'){mainActions.hidden=true;fileKinds.hidden=false;return}if(action==='album')return addFile('image','相册');if(action==='camera')return addFile('image','拍照');addFile(action,'文件')});
    function submitMaterials(){const empty=[...document.querySelectorAll('.material-card')].some(card=>card.dataset.uploaded!=='true');if(empty){showToast('上传图片不能为空');return}document.getElementById('collection-page').hidden=true;document.getElementById('success-page').hidden=false}
    function returnHome(){showToast('已返回首页')}
    function init(){const p=new URLSearchParams(location.search);document.body.dataset.prototypeMode=p.get('prototypeMode')||'annotation';if(p.get('prototypeScenario')==='P07-S01'){document.getElementById('collection-page').hidden=true;document.getElementById('success-page').hidden=false}}
    window.addEventListener('message',e=>{if(e.data.type==='prototype:set-mode')document.body.dataset.prototypeMode=e.data.mode;if(e.data.type==='prototype:scenario'&&e.data.scenarioId==='P07-S01'){document.getElementById('collection-page').hidden=true;document.getElementById('success-page').hidden=false}if(e.data.type==='prototype:reset'){document.getElementById('collection-page').hidden=false;document.getElementById('success-page').hidden=true}if(e.data.type==='prototype:highlight'){const n=document.querySelector('[data-change-id="'+e.data.changeId+'"]');if(n){n.scrollIntoView({behavior:'smooth',block:'center'});n.classList.add('highlight');setTimeout(()=>n.classList.remove('highlight'),1500)}}});init()
  </script>
</body>
</html>

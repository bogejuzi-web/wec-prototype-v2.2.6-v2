<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P02 万能表单详情</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",Arial;color:#172433;background:#f5f7f8;font-size:14px}.top{height:50px;background:#00988f;color:#fff;display:flex;align-items:center}.brand{padding:0 20px;font-size:20px;font-weight:bold;width:210px}.top b{padding:16px 20px;font-weight:500}.top b.on{background:#007d76}.screen{height:calc(100vh - 50px);display:flex}.nav{width:210px;background:#fff;padding:10px 5px;border-right:1px solid #eee}.nav div{padding:10px 25px;height:44px}.nav .sel{background:#c6dcd7;color:#008f86;border-radius:7px}.work{flex:1;min-width:0}.tabs{height:40px;background:#fff;padding:11px 18px;color:#008f86}.designer{height:calc(100vh - 90px);display:grid;grid-template-columns:265px minmax(430px,1fr) 320px;background:#fff;border-top:1px solid #eceff0}.left{border-right:1px solid #e8ebed;padding:14px 12px;overflow:auto}.toolhead{display:flex;gap:22px;color:#1677ff;border-bottom:2px solid #1677ff;width:max-content;padding-bottom:10px}.group{border:1px solid #e6e9eb;margin-top:15px;padding:14px}.group h3{margin:0 0 14px;font-size:16px}.components{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px}.component{text-align:center;color:#263849;font-size:12px}.icon{margin:auto auto 7px;border:1px solid #1d2c3a;border-radius:4px;width:23px;height:23px;line-height:21px;font-size:14px}.center{background:#f6f6f6;position:relative;overflow:auto}.bar{height:58px;background:#fff;border-bottom:1px solid #eceff0;padding:16px;text-align:center;letter-spacing:8px;color:#536271}.phone{width:390px;min-height:620px;margin:20px auto;background:#fff;border:7px solid #111;border-radius:30px;padding:35px 16px;box-shadow:0 3px 10px #0002}.phone h2{font-size:17px;margin:0 0 20px}.field{padding:12px 8px;border:1px dashed #82b6ff;margin-bottom:10px;position:relative}.field.active{border:2px solid #1677ff;background:#f4f9ff}.field label{display:block;margin-bottom:7px}.field input{width:100%;height:34px;border:1px solid #e2e5e8;border-radius:4px;padding:0 8px}.right{border-left:1px solid #e8ebed;padding:18px 20px;overflow:auto}.right h3{margin:0 -20px 14px;padding:0 20px 13px;border-bottom:1px solid #eee}.label{display:block;margin:13px 0 7px}.input,.select{width:100%;height:33px;border:1px solid #d9dfe5;border-radius:4px;padding:0 8px;background:#fff}.section{margin:25px -20px 0;padding:16px 20px;border-top:1px solid #eee}.section h4{margin:0;color:#273746}.switch{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.toggle{width:36px;height:20px;border-radius:11px;background:#009b92;display:inline-block;position:relative;cursor:pointer}.toggle:after{content:"";position:absolute;top:3px;right:3px;width:14px;height:14px;border-radius:50%;background:#fff}.toggle.off{background:#cbd2da}.toggle.off:after{left:3px;right:auto}.change-tag{display:inline-block;background:#fff0c7;color:#9a6900;border-radius:8px;padding:1px 5px;font-size:11px;margin-left:4px}.hidden{display:none}.toast{display:none;position:fixed;z-index:20;left:50%;top:65px;transform:translateX(-50%);padding:9px 18px;background:#183f3b;color:white;border-radius:4px}.toast.show{display:block}body[data-prototype-mode="prototype"] .change-tag{display:none}.highlight{outline:3px solid #f59e0b;outline-offset:3px}@media(max-width:1000px){.nav{display:none}.designer{grid-template-columns:225px minmax(360px,1fr) 285px}.phone{transform:scale(.88);transform-origin:top center}}
</style></head><body><header class="top"><span class="brand">▰ 睿聆智能云</span><b>☰</b><b>◔ 客服工作台</b><b class="on">▣ 业务工作台</b><b>⚙ 系统控制台</b></header><div class="screen"><aside class="nav"><div>▤ 服务管理</div><div>▤ 产品管理</div><div>▤ 企业管理</div><div>▱ 项目管理</div><div>▣ 会员管理</div><div class="sel">⚙ 万能表单配置</div></aside><main class="work"><div class="tabs">‹　待办事项　　万能表单配置　×　　<span style="background:#d8ebe7;padding:10px 16px;border-radius:8px">移动端表单设计　×</span></div><div class="designer"><aside class="left"><div class="toolhead"><b>▦ 组件</b><b style="color:#333">大纲</b></div><div class="group"><h3>基础组件　›</h3><div class="components"><div class="component"><div class="icon">T</div>输入框</div><div class="component"><div class="icon">▤</div>多行输入框</div><div class="component"><div class="icon">▣</div>密码输入框</div><div class="component"><div class="icon">12</div>数字输入框</div><div class="component"><div class="icon">◉</div>单选框</div><div class="component"><div class="icon">☑</div>多选框</div><div class="component"><div class="icon">⌄</div>选择器</div><div class="component"><div class="icon">◌</div>开关</div><div class="component"><div class="icon">☆</div>评分</div><div class="component"><div class="icon">◷</div>时间</div><div class="component"><div class="icon">▣</div>日期</div><div class="component"><div class="icon">☷</div>滑块</div></div></div><div class="group"><h3>子表单组件　›</h3><div class="components"><div class="component"><div class="icon">▤</div>子表单</div><div class="component"><div class="icon">▯</div>分组</div><div class="component"><div class="icon">▦</div>表格表单</div></div></div></aside><section class="center"><div class="bar">▣　▯　▥　　↶　↷　　<span style="background:#e5f9e9;color:#20a758;padding:6px 12px;letter-spacing:0">☁ 保存</span>　<span style="background:#e8f2ff;color:#1677ff;padding:6px 12px;letter-spacing:0">◉ 预览</span></div><article class="phone"><h2>海外多学科会诊服务申请</h2><div class="field"><label>就诊人姓名 <b style="color:#f24">*</b></label><input placeholder="请输入姓名"></div><div class="field active" data-change-id="P02-C01"><label>联系电话 <b style="color:#f24">*</b></label><input value="13800000000"></div><div class="field"><label>期望医院</label><input placeholder="请输入期望医院"></div><div class="field"><label>病情简述 <b style="color:#f24">*</b></label><input placeholder="请填写病情说明"></div><button style="width:100%;height:38px;border:0;border-radius:4px;background:#009b92;color:#fff">提交服务请求</button></article></section><aside class="right"><h3>组件配置　　表单配置</h3><label class="label">字段 ID</label><input class="input" value="contact_phone"><label class="label">字段名称</label><input class="input" value="联系电话"><label class="label">提示信息</label><input class="input" value="请输入联系电话"><section class="section" data-change-id="P02-C01"><h4>数据回传配置 <span class="change-tag">P02-C01</span></h4><div class="switch"><span>是否回传</span><span id="toggle" class="toggle" onclick="switchReturn()"></span></div><div id="configs"><label class="label" data-change-id="P02-C02">回传字段名称 <span class="change-tag">P02-C02</span></label><input class="input" value="contactPhone"><label class="label">回传阶段 <span class="change-tag">P02-C02</span></label><select class="select"><option>服务请求单</option><option>服务工单</option></select><label class="label">字段回传时机 <span class="change-tag">P02-C02</span></label><select class="select"><option>待处理</option><option>处理中</option><option>预约成功</option><option>已完成</option></select></div></section></aside></div></main></div><div id="toast" class="toast"></div><script>function switchReturn(){let a=document.getElementById('toggle'),b=document.getElementById('configs');a.classList.toggle('off');b.classList.toggle('hidden');showToast(a.classList.contains('off')?'该字段将不回传':'请完善回传配置')}function showToast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}function init(){document.body.dataset.prototypeMode=new URLSearchParams(location.search).get('prototypeMode')||'annotation'}window.addEventListener('message',e=>{if(e.data.type==='prototype:set-mode')document.body.dataset.prototypeMode=e.data.mode;if(e.data.type==='prototype:highlight'){let n=document.querySelector('[data-change-id="'+e.data.changeId+'"]');if(n){n.scrollIntoView({behavior:'smooth',block:'center'});n.classList.add('highlight');setTimeout(()=>n.classList.remove('highlight'),1500)}}});init()</script></body></html>

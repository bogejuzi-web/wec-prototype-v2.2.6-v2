<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P06 H5 服务发起</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:#253747;font:14px "Microsoft YaHei",Arial}.phone{min-height:100vh;max-width:430px;margin:auto;background:#f6f9fa}.header{height:56px;background:#fff;display:flex;align-items:center;padding:0 18px;box-shadow:0 1px 4px #00000010}.back{font-size:26px;color:#333}.header h1{font-size:17px;margin:auto}.hero{padding:22px 18px;background:linear-gradient(135deg,#ddf7f3,#edf8ff)}.hero h2{margin:0 0 7px;font-size:21px}.hero p{margin:0;color:#52707b}.card{margin:14px 14px 0;padding:18px;background:#fff;border-radius:10px;box-shadow:0 1px 5px #dce6e9}.card h3{margin:0 0 17px;border-left:3px solid #09a093;padding-left:8px;font-size:16px}.label{display:block;margin:16px 0 7px}.req{color:#ef5b5b}.input,.textarea{width:100%;border:1px solid #e0e6e8;border-radius:6px;padding:10px;font:14px inherit}.input{height:42px}.textarea{height:86px}.select{height:42px;background:#fff;color:#6d7c85}.submit{height:46px;width:100%;border:0;border-radius:23px;margin-top:24px;background:#009b92;color:#fff;font-size:16px;cursor:pointer}.toast{position:fixed;z-index:2;left:50%;bottom:28px;transform:translate(-50%,15px);padding:10px 16px;border-radius:4px;background:#263542;color:#fff;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.tag{background:#fff0c7;color:#9a6900;border-radius:8px;padding:1px 5px;font-size:11px}body[data-prototype-mode="prototype"] .tag{display:none}.highlight{outline:3px solid #f59e0b;outline-offset:2px}
</style></head><body><main class="phone"><header class="header"><span class="back">‹</span><h1>发起服务</h1><span style="width:18px"></span></header><section class="hero"><h2>海外多学科会诊（MDT）</h2><p>请填写本次服务所需信息，我们将尽快为您安排。</p></section><section class="card" data-change-id="P06-C02"><h3>服务请求信息 <span class="tag">P06-C02</span></h3><label class="label">就诊人姓名 <span class="req">*</span></label><input class="input" value="王攀"><label class="label">联系电话 <span class="req">*</span></label><input class="input" value="16621701118"><label class="label">期望医院</label><input class="input" placeholder="请输入期望医院"><label class="label">期望科室</label><select class="input select"><option>请选择期望科室</option><option>内分泌科</option><option>肿瘤科</option></select><label class="label">病情简述 <span class="req">*</span></label><textarea class="textarea" placeholder="请填写病情说明"></textarea><button class="submit" type="button" onclick="submitRequest()">提交服务请求</button></section></main><div id="toast" class="toast" role="status"></div><script>function submitRequest(){const node=document.getElementById('toast');node.textContent='服务请求已提交';node.classList.add('show');setTimeout(()=>node.classList.remove('show'),1800)}function init(){document.body.dataset.prototypeMode=new URLSearchParams(location.search).get('prototypeMode')||'annotation'}window.addEventListener('message',e=>{if(e.data.type==='prototype:set-mode')document.body.dataset.prototypeMode=e.data.mode;if(e.data.type==='prototype:highlight'){let n=document.querySelector('[data-change-id="'+e.data.changeId+'"]');if(n){n.scrollIntoView({behavior:'smooth',block:'center'});n.classList.add('highlight');setTimeout(()=>n.classList.remove('highlight'),1500)}}});init()</script></body></html>
